# Serveur MCP de SpectraLLM, en surcouche de docker-compose.yml.
#
#   SPECTRALLM_URL=http://host.docker.internal:8089 SPECTRA_API_KEY=... \
#     docker compose -f docker-compose.yml -f compose/spectrallm.yml up -d
#
# L'agent gagne les outils spectra_* à côté des kex_* de Kafka SQL Explorer, tous en lecture seule. Il
# n'en propose que trois au modèle : spectra_search, spectra_list_documents et
# spectra_preview_document. spectra_ask, qui fait rédiger la réponse par le LLM de SpectraLLM, et
# spectra_status, réservé au diagnostic, sont refusés par application.yml. Pour les rendre :
# KEX_SPECTRA_ASK_DENIED=false, KEX_SPECTRA_STATUS_DENIED=false.
#
# SpectraLLM n'est pas démarré ici : il tourne ailleurs, en 0.10.0 au moins, avec
# SPECTRA_MCP_ENABLED=true et une SPECTRA_API_KEY (sans clé, son /mcp répond 503). Depuis
# Kafka SQL Explorer, compose/spectra-hub.yml + compose/spectra-hub.mcp.yml en fournissent un.
#
# Ports : un plan commun aux trois projets — 8080 Kafka SQL Explorer, 8081 cet agent, 8088/8089
# interface/API SpectraLLM, 9092 Kafka. La pile spectra-hub de Kafka SQL Explorer publie donc
# l'API Spectra sur 8089, et les deux piles tournent côte à côte sans réglage.
services:
  agent:
    environment:
      SPECTRALLM_URL: ${SPECTRALLM_URL:?requis, URL de l'API SpectraLLM vue depuis le conteneur}
      SPECTRA_API_KEY: ${SPECTRA_API_KEY:?requis, la cle API de SpectraLLM}
      # La connexion MCP, par liaison souple de Spring : spring.ai.mcp.client.streamable-http
      # .connections.spectrallm. Ajoutée ici plutôt que dans application.yml, pour qu'une
      # installation sans SpectraLLM n'ait pas un serveur injoignable dans sa liste.
      SPRING_AI_MCP_CLIENT_STREAMABLEHTTP_CONNECTIONS_SPECTRALLM_URL: ${SPECTRALLM_URL}
      SPRING_AI_MCP_CLIENT_STREAMABLEHTTP_CONNECTIONS_SPECTRALLM_ENDPOINT: /mcp
    # host.docker.internal n'existe pas d'office sous Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
