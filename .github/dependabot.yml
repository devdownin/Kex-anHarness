version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Spring Boot et Spring AI se mettent à jour par familles : une PR par artefact
      # produirait une douzaine de branches qui se contredisent au merge.
      spring:
        patterns:
          - "org.springframework*"
      test:
        patterns:
          - "org.mockito*"
          - "org.junit*"
          - "org.assertj*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuse une analyse si init et analyze ne viennent pas de la même version.
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # L'image et la CI tournent en JDK 21, la LTS. Le 24 n'est pas une LTS : sa montée fermée
      # (#202) reviendrait chaque semaine sans cette règle. La prochaine LTS reste proposée.
      - dependency-name: eclipse-temurin
        versions: [">= 24, < 25"]
