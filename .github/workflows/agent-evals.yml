name: Agent reliability evaluations (paid opt-in)

on:
  workflow_dispatch:
    inputs:
      acknowledge_provider_cost:
        description: 'I authorize real provider calls for this evaluation'
        type: boolean
        required: true
        default: false
      provider:
        description: 'Provider'
        type: choice
        options: [anthropic, openai]
        default: anthropic
      baseline_model:
        description: 'Explicit baseline model ID (same provider and code)'
        type: string
        required: true
      candidate_model:
        description: 'Explicit candidate model ID (may equal the baseline to compare harness options)'
        type: string
        required: true
      baseline_options:
        description: 'Harness options for the baseline, comma-separated: compaction, results, discovery, selection'
        type: string
        required: false
        default: ''
      candidate_options:
        description: 'Harness options for the candidate, comma-separated: compaction, results, discovery, selection'
        type: string
        required: false
        default: ''
      repetitions:
        description: 'Trials per scenario, 2 through 10'
        type: choice
        options: ['2', '3', '5', '10']
        default: '3'

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate:
    # No PR trigger, pull_request_target, arbitrary code ref, or provider keys on work branches.
    if: github.ref == 'refs/heads/main' && inputs.acknowledge_provider_cost
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEX_AGENT_LLM_PROVIDER: ${{ inputs.provider }}
      KEX_EVAL_REPETITIONS: ${{ inputs.repetitions }}
      KEX_EVAL_REVISION: ${{ github.sha }}
      BASELINE_MODEL: ${{ inputs.baseline_model }}
      CANDIDATE_MODEL: ${{ inputs.candidate_model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          java-version: '21'
          distribution: temurin
      # Lecture seule : le cache est écrit par le job `build` de ci.yml (voir là-bas).
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Validate corpus and scoring offline
        run: ./mvnw -B --no-transfer-progress test -Dtest=AgentEvalScoringTest,AgentEvalHarnessTest
      - name: Evaluate baseline
        id: baseline
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Passées par l'environnement, jamais interpolées dans la commande ; une option inconnue
          # arrête l'exécution avant le premier appel payant (AgentEvalHarness.withOptions).
          KEX_EVAL_OPTIONS: ${{ inputs.baseline_options }}
        run: bash scripts/evals-run.sh "$BASELINE_MODEL" target/agent-evals/baseline.json
      - name: Evaluate candidate and compare every scenario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KEX_EVAL_OPTIONS: ${{ inputs.candidate_options }}
        run: bash scripts/evals-run.sh "$CANDIDATE_MODEL" target/agent-evals/candidate.json target/agent-evals/baseline.json
      - name: Retain reports including failed and interrupted runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: agent-evaluations-${{ github.run_id }}
          path: target/agent-evals/*.json
          retention-days: 30
