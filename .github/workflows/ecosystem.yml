name: Ecosystem

# Ce qui dérive en silence entre les trois projets, demandé sur une minuterie plutôt que par la
# prochaine pull request venue :
#   - l'image de Kafka SQL Explorer que la stack tire, face à ce que Docker Hub sert ;
#   - scripts/check-ecosystem.py, le même fichier dans les trois dépôts, face à ses deux copies.
# Ni l'un ni l'autre ne tourne sur une pull request : une publication de l'Explorer ne doit pas
# faire échouer une PR qui n'y touche pas, et un changement du script partagé arrive en trois PR,
# dont la première fusionnée ferait sinon échouer les deux autres.
on:
  schedule:
    # Hebdomadaire, jeudi 06:47 UTC : hors de l'heure pile et des jours déjà pris.
    - cron: '47 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Un registre injoignable est un ::warning:: dans le script, pas un échec.
      - name: Is the Explorer pin still the published release?
        run: python3 scripts/check-explorer-pin.py --published

      - name: Is the shared ecosystem script identical across the three repositories?
        run: python3 scripts/check-ecosystem.py --siblings

  # Quand Docker Hub sert une version de Kafka SQL Explorer plus récente que l'épinglage, ouvre la
  # PR qui le monte, au lieu de seulement passer au rouge ci-dessus. Le job explorer-contract de
  # cette PR rejoue alors le contrat réel contre la nouvelle image avant tout merge — ce qui a
  # attrapé le défaut de schéma de la 2.3.0. Une PR ouverte avec GITHUB_TOKEN ne lance pas la CI
  # d'elle-même (règle de GitHub contre les boucles) : la fermer et la rouvrir la lance.
  explorer-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      # AUTOMATION_PR_TOKEN est facultatif : avec lui, la PR lance la CI d'elle-même (explorer-contract
      # rejoue alors le contrat sans qu'on la ferme et la rouvre) ; sans lui, GITHUB_TOKEN l'ouvre
      # quand même, mais la CI ne part pas.
      GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN != '' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Move the Explorer pin to what Docker Hub serves
        id: bump
        run: |
          set -euo pipefail
          python3 scripts/check-explorer-pin.py --bump | tee bump.txt
          if git diff --quiet; then echo "moved=false" >> "$GITHUB_OUTPUT"; else echo "moved=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open the pull request
        if: steps.bump.outputs.moved == 'true'
        run: |
          set -euo pipefail
          version=$(grep -oP 'kafkaexplorer:\$\{EXPLORER_IMAGE_TAG:-\K[^}]+' docker-compose.yml)
          branch="chore/explorer-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Kafka SQL Explorer épinglé en ${version}"
          git push -u origin "$branch"
          if [ "$HAS_PR_TOKEN" = true ]; then
            note="La CI part d'elle-même : PR ouverte avec AUTOMATION_PR_TOKEN."
          else
            note="Ouverte par GITHUB_TOKEN, la CI ne part pas d'elle-même : fermer et rouvrir la PR la lance."
          fi
          if ! gh pr create --base "$DEFAULT_BRANCH" --title "Kafka SQL Explorer épinglé en ${version}" \
            --body "$(printf '%s\n' \
              "Docker Hub sert \`kafkaexplorer:${version}\`. \`scripts/check-explorer-pin.py --bump\` a monté l'épinglage dans les trois fichiers qui le portent :" \
              "" "\`\`\`" "$(cat bump.txt)" "\`\`\`" "" \
              "À merger une fois \`explorer-contract\` vert : il rejoue le contrat MCP réel contre cette image. $note" \
              "" "---" "_Generated by [Claude Code](https://claude.ai/code)_")"; then
            echo "::error::La branche ${branch} est poussée mais la PR n'a pas pu être ouverte. Si c'est un refus de permission : Settings → Actions → General → « Allow GitHub Actions to create and approve pull requests »."
            exit 1
          fi
