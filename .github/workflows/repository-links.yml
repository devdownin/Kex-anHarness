name: Repository links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-links:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Reject obsolete agent repository URLs
        run: python3 scripts/check-repository-links.py
      # La section Écosystème des README et de DOCKERHUB.md est générée par ce script, le même
      # fichier dans les trois dépôts (Kafka SQL Explorer, SpectraLLM, Kex-anHarness) : retouchée
      # à la main dans un seul, elle dérive des deux autres.
      - name: Ecosystem section matches the shared definition
        run: python3 scripts/check-ecosystem.py
      # L'épinglage de l'Explorer est écrit à la main dans trois fichiers ; ils doivent dire la
      # même version. Le retard sur Docker Hub, lui, se demande sur planification (ecosystem.yml).
      - name: Explorer pin is the same in every file
        run: python3 scripts/check-explorer-pin.py
      # Le README anglais avait gagné trois sections jamais reportées en français. La traduction
      # ne se vérifie pas, la charpente si : mêmes titres, mêmes blocs de code, ancres vivantes.
      - name: README EN and FR share one structure
        run: python3 scripts/check-readme-parity.py
