name: Browser (slow CPU)

# La suite navigateur de ci.yml, rejouée avec le processeur du navigateur ralenti. Deux défauts de
# test — deux page.goto de suite dont les hashchange lisent tous deux le hash final, et des poignées
# d'éléments détachées par un re-rendu — n'apparaissaient que sous charge : jamais en local à vitesse
# normale, et au hasard seulement sur un exécuteur chargé, donc sur la pull request de quelqu'un
# d'autre. Ralentir le navigateur les fait apparaître ici, à date fixe, plutôt que là.
#
# Planifié, pas sur chaque pull request : la suite dure plusieurs fois son temps normal, et un
# rouge ici dit « une course existe » — pas « cette PR a un défaut ». Il se lance quand même sur la
# PR qui modifie le réglage lui-même, pour qu'il ne soit jamais fusionné sans avoir tourné.
on:
  schedule:
    # Hebdomadaire, mercredi 03:23 UTC : hors de l'heure pile et des jours déjà pris (CodeQL le
    # lundi, Scorecard le mardi, Ecosystem le jeudi).
    - cron: '23 3 * * 3'
  workflow_dispatch:
    inputs:
      rate:
        description: Facteur de ralentissement du processeur (1 = aucun)
        default: '8'
  pull_request:
    paths:
      - .github/workflows/browser-throttled.yml
      - src/test/browser/throttle.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Même système que le job `browser` de ci.yml : Playwright 1.56.1 ne fournit pas les
    # dépendances Chromium pour Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package the agent
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1

      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start the agent
        run: |
          set -euo pipefail
          java -jar target/kex-agent-ai-*.jar \
            --server.port=8081 \
            --kex.agent.api-key=ci-secret \
            --kex.agent.supervision.processes[0].id=order-integration \
            --kex.agent.supervision.processes[0].name='Order Integration' \
            --kex.agent.supervision.processes[1].id=customer-import \
            --kex.agent.supervision.processes[1].name='Customer Import' \
            --spring.ai.mcp.client.enabled=false \
            --spring.ai.model.chat=openai \
            --spring.ai.model.embedding=none \
            --spring.ai.openai.api-key=ci-dummy \
            --spring.ai.openai.base-url=http://127.0.0.1:8098 \
            --spring.ai.openai.chat.options.model=c/moyen \
            > "$RUNNER_TEMP/agent.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/actuator/health

      # Les deux scripts qui portent le réglage : les plus longs, et ceux où les courses ont été
      # trouvées. Le facteur passe par l'environnement, jamais interpolé dans la commande.
      - name: Drive the console, slowed
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          KEX_AGENT_URL: http://localhost:8081
          KEX_AGENT_API_KEY: ci-secret
          KEX_CPU_THROTTLE: ${{ inputs.rate || '8' }}
        run: |
          timeout 15m node src/test/browser/first-run.mjs
          timeout 30m node src/test/browser/console.mjs

      - name: Agent logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/agent.log" || true

      - name: Upload agent logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: agent-browser-throttled-log
          path: ${{ runner.temp }}/agent.log
          retention-days: 7
