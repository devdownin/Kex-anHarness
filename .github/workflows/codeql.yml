name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    # Une analyse hebdomadaire même sans commit : les requêtes CodeQL évoluent, pas seulement le code.
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
      # Lecture seule : le cache est écrit par le job `build` de ci.yml (voir là-bas).
      - name: Restore Maven repository
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
