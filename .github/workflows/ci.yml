name: CI

# `push` ne vise que main : une branche de travail est couverte par sa pull request,
# et lister les deux construirait chaque commit deux fois (les événements push et
# pull_request portent des refs différentes, la concurrency ne peut pas les fusionner).
# `pull_request` sans filtre de base pour qu'une PR empilée sur une autre branche soit
# construite elle aussi.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # La suite tourne en ~1 minute ; sans plafond un test bloqué irait au défaut de 360.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Aucun secret : le profil `test` fournit une clé Anthropic factice et désactive le
      # client MCP, donc la suite ne sort jamais sur le réseau. Un fork construit à l'identique.
      # `verify` couvre le format, les en-têtes de licence, les tests, le seuil de couverture
      # et la génération du SBOM : ce que la CI vérifie est ce qu'un contributeur exécute.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: sbom
          path: target/classes/META-INF/sbom/*.json
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # La suite Java sert les fichiers de la console et vérifie que les chemins d'API qu'ils citent
  # existent ; elle n'exécute pas une ligne de JavaScript. Les défauts d'interface corrigés
  # jusqu'ici ont tous été trouvés à la main, donc une fois, donc sans garantie qu'ils ne
  # reviennent pas. Ce job les rejoue.

  mcp-interop:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run MCP interoperability contract
        run: ./mvnw -B --no-transfer-progress -Dtest=KexMcpServerInteropContractTest,KexMcpServerComplianceTest test

      # Vérifie le serveur via le SDK MCP officiel, pas seulement via MockMvc.
      - name: Package the MCP server
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Install official MCP client
        run: npm install --prefix "$RUNNER_TEMP/mcp-client" --no-save --no-package-lock @modelcontextprotocol/sdk@1.18.2

      - name: Start MCP server for external client
        run: |
          set -euo pipefail
          java -jar target/kex-agent-ai-*.jar \
            --server.port=8082 \
            --kex.agent.api-key=ci-secret \
            --kex.mcp.server.enabled=true \
            --spring.ai.mcp.client.enabled=false \
            --spring.ai.model.chat=openai \
            --spring.ai.model.embedding=none \
            --spring.ai.openai.api-key=ci-dummy \
            --spring.ai.openai.base-url=http://127.0.0.1:8098 \
            --spring.ai.openai.chat.options.model=c/moyen \
            > "$RUNNER_TEMP/mcp-agent.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8082/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8082/actuator/health

      - name: Drive MCP with official SDK
        env:
          MCP_SDK_MODULE: ${{ runner.temp }}/mcp-client/node_modules/@modelcontextprotocol/sdk/dist/esm/client/index.js
          MCP_SDK_HTTP_MODULE: ${{ runner.temp }}/mcp-client/node_modules/@modelcontextprotocol/sdk/dist/esm/client/streamableHttp.js
          KEX_MCP_URL: http://localhost:8082/api/agent/mcp-server
          KEX_AGENT_API_KEY: ci-secret
        run: node src/test/mcp/external-client.mjs

      - name: MCP server logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/mcp-agent.log" || true


  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Pas de setup-node : les exécuteurs GitHub embarquent Node et npm, et le script n'utilise
      # que des API stables depuis Node 18. Une action de plus, c'est une empreinte de plus à
      # épingler et à suivre pour une version dont on n'a pas besoin.
      # Le jar seulement : la suite a déjà tourné dans le job `build`, la relancer ici ne
      # vérifierait rien de plus et doublerait le temps de restitution.
      - name: Package the agent
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1

      # Hors de l'arborescence et sans package.json : Playwright n'est pas une dépendance du
      # projet, et un manifeste npm à la racine ferait vivre une seconde chaîne de construction
      # pour un seul fichier de vérification.
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      # Fournisseur `openai` pointé sur la passerelle factice que le script démarre lui-même :
      # la CI ne sort jamais vers un tiers. Aucun échange n'est demandé au modèle, la clé n'a donc
      # qu'à exister. Les processus sont déclarés pour que les vues aient des lignes à montrer.
      - name: Start the agent
        run: |
          set -euo pipefail
          java -jar target/kex-agent-ai-*.jar \
            --server.port=8081 \
            --kex.agent.api-key=ci-secret \
            --kex.agent.supervision.processes[0].id=order-integration \
            --kex.agent.supervision.processes[0].name='Order Integration' \
            --kex.agent.supervision.processes[1].id=customer-import \
            --kex.agent.supervision.processes[1].name='Customer Import' \
            --spring.ai.mcp.client.enabled=false \
            --spring.ai.model.chat=openai \
            --spring.ai.model.embedding=none \
            --spring.ai.openai.api-key=ci-dummy \
            --spring.ai.openai.base-url=http://127.0.0.1:8098 \
            --spring.ai.openai.chat.options.model=c/moyen \
            > "$RUNNER_TEMP/agent.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/actuator/health

      - name: Drive the console
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          KEX_AGENT_URL: http://localhost:8081
          KEX_AGENT_API_KEY: ci-secret
        run: |
          node src/test/browser/actions-menu.mjs
          node src/test/browser/first-run.mjs
          node src/test/browser/ui-controls.mjs
          node src/test/browser/forecasts.mjs
          node src/test/browser/process-associations.mjs
          node src/test/browser/mcp-services.mjs
          node src/test/browser/tasks.mjs
          node src/test/frontend/user-stream.mjs
          node src/test/frontend/user-experience.mjs
          node src/test/frontend/user-results.mjs
          node src/test/frontend/user-presentation.mjs
          node src/test/frontend/user-evidence.mjs
          node src/test/frontend/user-notifications.mjs
          node src/test/frontend/user-context.mjs
          node src/test/frontend/mcp-services.mjs
          node src/test/browser/user-workspace.mjs
          node src/test/browser/user-approvals-favorites.mjs
          node src/test/browser/user-context-history.mjs
          node src/test/browser/user-onboarding.mjs
          node src/test/browser/user-work-overview.mjs
          timeout 10m node src/test/browser/console.mjs

      - name: Agent logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/agent.log" || true

      - name: Upload agent logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: agent-browser-log
          path: ${{ runner.temp }}/agent.log
          retention-days: 7

  # Le Dockerfile et le compose sont livrés avec l'application : sans ce job ils ne sont
  # vérifiés par personne avant un `docker compose up` en production.
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build the agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          push: false
          load: true
          tags: kex-agent-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le même seuil que Publish doit passer sur la PR, avant un tag ou un accès aux registres.
      - name: Scan the agent image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kex-agent-ai:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # L'image doit démarrer sans serveur MCP joignable : c'est l'invariant que
      # l'initialisation paresseuse des clients MCP existe pour tenir.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name kex-agent-smoke -p 8081:8081 \
            -e ANTHROPIC_API_KEY=ci-dummy -e KEX_AGENT_API_KEY=ci-secret \
            kex-agent-ai:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/actuator/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/agent/mcp/servers)" = 401
          curl -fsS -H 'Authorization: Bearer ci-secret' http://localhost:8081/api/agent/mcp/servers

      - name: Agent logs on failure
        if: failure()
        run: docker logs kex-agent-smoke || true

      # Le conteneur occupe 8081, que la stack de fumée publie aussi.
      - name: Stop the single-container smoke test
        if: always()
        run: docker rm -f kex-agent-smoke || true

      - name: Validate the compose stacks
        env:
          ANTHROPIC_API_KEY: ci-dummy
          EXPLORER_MCP_AUTH_TOKEN: ci-token
          KEX_AGENT_API_KEY: ci-secret
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f compose/shared-memory.yml config --quiet
          SPECTRALLM_URL=http://spectra:8080 SPECTRA_API_KEY=ci-key \
            docker compose -f docker-compose.yml -f compose/spectrallm.yml config --quiet

      # Valider la syntaxe ne prouve pas que la stack se parle. Celle-ci est montée pour de vrai,
      # avec un serveur MCP factice au lieu de Kafka SQL Explorer : ce qui est vérifié ici
      # appartient à ce dépôt (image, réseau, propagation du bearer, découverte MCP), et la CI ne
      # dépend pas d'un pull Docker Hub anonyme et de son quota par IP.
      - name: Bring the smoke stack up
        env:
          KEX_AGENT_API_KEY: smoke-secret
          EXPLORER_MCP_AUTH_TOKEN: smoke-token
        run: |
          docker tag kex-agent-ai:ci kex-agent-ai:smoke
          docker compose -f compose/smoke.yml up -d --wait

      - name: The agent must discover the stub through the stack
        run: |
          set -euo pipefail
          servers=$(curl -fsS -H 'Authorization: Bearer smoke-secret' \
            http://localhost:8081/api/agent/mcp/servers)
          echo "$servers"
          echo "$servers" | grep -q '"serverName":"mcp-stub"'
          echo "$servers" | grep -q '"initialized":true'
          echo "$servers" | grep -q '"name":"echo"'
          result=$(curl -fsS -X POST -H 'Authorization: Bearer smoke-secret' \
            -H 'Content-Type: application/json' -d '{"arguments":{"texte":"ping"}}' \
            http://localhost:8081/api/agent/mcp/servers/kafka-explorer/tools/echo)
          echo "$result"
          echo "$result" | grep -q 'pong'

      - name: Smoke stack logs on failure
        if: failure()
        run: docker compose -f compose/smoke.yml logs || true

      - name: Tear the smoke stack down
        if: always()
        run: docker compose -f compose/smoke.yml down -v || true

  # Le contrat réel avec Kafka SQL Explorer, contre l'image que docker-compose.yml épingle.
  # Il est resté opt-in tant que personne ne le lançait : c'est pourtant lui qui a trouvé que
  # la 2.3.0 refusait une étape sans groupe de consommateurs, ce qu'aucun serveur factice ne
  # pouvait dire. L'image vient de GHCR, miroir exact de Docker Hub, pour ne pas dépendre du
  # quota anonyme de Docker Hub par IP — la raison pour laquelle la stack de fumée ci-dessus
  # utilise un serveur factice.
  explorer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPLORER_IMAGE_NAMESPACE: ghcr.io/devdownin
      EXPLORER_MCP_AUTH_TOKEN: contract-token
      KEX_AGENT_API_KEY: contract-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Bring Kafka and the pinned Explorer up
        run: |
          set -euo pipefail
          docker compose up -d kafka explorer
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/liveness 2>/dev/null | grep -q UP && break
            sleep 3
          done
          curl -fsS http://localhost:8080/actuator/health/liveness
          docker compose images explorer

      # Le topic et le groupe que le test lit par défaut : un topic semé, un groupe qui l'a lu.
      - name: Seed the contract topic
        run: |
          set -euo pipefail
          docker compose exec -T kafka bash -c '
            bin=/opt/kafka/bin
            $bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
              --topic demo.orders.1.received --partitions 1 --replication-factor 1
            for i in $(seq 1 20); do echo "{\"orderId\":\"o$i\",\"status\":\"RECEIVED\"}"; done \
              | $bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic demo.orders.1.received
            $bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic demo.orders.1.received \
              --group demo-orders --from-beginning --max-messages 5 --timeout-ms 20000 >/dev/null'

      - name: Run the live contract
        env:
          KAFKA_EXPLORER_MCP_URL: http://localhost:8080
          KAFKA_EXPLORER_MCP_TOKEN: contract-token
        run: |
          ./mvnw -B --no-transfer-progress -Dtest=KafkaExplorerLiveContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      # Un test qui se saute passe au vert : la sortie le dit, ce pas l'interdit.
      - name: The contract must have run, not been skipped
        run: |
          set -euo pipefail
          report=target/surefire-reports/com.kex.agent.mcp.KafkaExplorerLiveContractTest.txt
          cat "$report"
          grep -q 'Tests run: 1, Failures: 0, Errors: 0, Skipped: 0' "$report"

      # Les captures de site/img/, régénérées sur l'agent branché sur ce même Explorer réel. Elles
      # partent en artefact : une PR qui change la console montre ce qu'elle fait à la page de
      # présentation, et les recopier reste un geste de revue.
      - name: Package and start the agent against this Explorer
        run: |
          set -euo pipefail
          ./mvnw -B --no-transfer-progress -DskipTests package
          KAFKA_EXPLORER_URL=http://localhost:8080 EXPLORER_MCP_AUTH_TOKEN=contract-token \
          nohup java -jar target/kex-agent-ai-*.jar \
            --server.port=8081 \
            --kex.agent.api-key=ci-secret \
            --kex.agent.supervision.processes[0].id=order-integration \
            --kex.agent.supervision.processes[0].name='Order Integration' \
            --spring.ai.model.chat=openai \
            --spring.ai.model.embedding=none \
            --spring.ai.openai.api-key=ci-dummy \
            --spring.ai.openai.base-url=http://127.0.0.1:8098 > agent.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8081/actuator/health

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1

      - name: Capture the landing page screenshots
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p fresh
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            node site/capture.mjs http://localhost:8081 fresh

      - name: Upload the fresh screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: site-screenshots
          path: fresh/
          retention-days: 14

      - name: Explorer logs on failure
        if: failure()
        run: |
          docker compose logs explorer || true
          cat agent.log 2>/dev/null || true

      - name: Tear the stack down
        if: always()
        run: docker compose down -v || true

  # Les captures de la page de présentation vieillissent sans bruit : personne ne les regarde tant
  # qu'elles ne sont pas fausses. Après chaque merge sur main, ce job compare celles que
  # `explorer-contract` vient de prendre à `site/img/` et, au-delà de 3 % de pixels changés (une
  # horloge ou un lissage restent sous 0,5 %), ouvre ou met à jour UNE pull request, toujours sur la
  # même branche : une dérive non traitée ne produit pas dix PR. Jamais sur une pull request : une
  # branche de travail n'a pas à en ouvrir une autre.
  refresh-screenshots:
    needs: explorer-contract
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      # AUTOMATION_PR_TOKEN est facultatif : avec lui, la PR lance la CI d'elle-même ; sans lui,
      # GITHUB_TOKEN l'ouvre quand même, mais la CI ne part pas (règle de GitHub contre les boucles).
      GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN != '' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download the fresh screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-screenshots
          path: fresh

      - name: Compare them to site/img
        id: drift
        run: |
          # GitHub lance `bash -e` : une pipe qui renvoie 1 (la dérive, cas attendu) tuerait l'étape
          # avant le `case`. Le code de sortie se lit donc hors pipe, -e suspendu le temps de l'appel.
          set -u
          set +e
          python3 scripts/compare-screenshots.py fresh site/img > drift.txt
          status=$?
          set -e
          cat drift.txt
          case "$status" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drifted=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Open or update the pull request
        if: steps.drift.outputs.drifted == 'true'
        run: |
          set -euo pipefail
          branch="chore/site-screenshots"
          cp fresh/overview.png fresh/integrations.png site/img/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add site/img
          git commit -m "Captures de la page de présentation reprises sur la Control Center"
          # Branche du robot, recréée à chaque dérive : la forcer évite qu'un second passage échoue
          # sur une branche déjà poussée alors que sa PR est encore ouverte.
          git push --force -u origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != "0" ]; then
            echo "Une pull request est déjà ouverte sur ${branch} : la branche est à jour, rien à créer."
            exit 0
          fi
          if [ "$HAS_PR_TOKEN" = true ]; then
            note="La CI part d'elle-même : PR ouverte avec AUTOMATION_PR_TOKEN."
          else
            note="Ouverte par GITHUB_TOKEN : la CI ne part pas d'elle-même, la fermer et la rouvrir la lance."
          fi
          if ! gh pr create --base "$DEFAULT_BRANCH" --title "Captures de la page de présentation à jour" \
            --body "$(printf '%s\n' \
              "Les captures prises par \`explorer-contract\` sur la Control Center réelle s'écartent de \`site/img/\` :" \
              "" "\`\`\`" "$(cat drift.txt)" "\`\`\`" "" \
              "Regarder les deux images avant de merger : un écart peut être un vrai changement d'écran, ou un état de démonstration inhabituel. $note" \
              "" "---" "_Generated by [Claude Code](https://claude.ai/code)_")"; then
            echo "::error::La branche ${branch} est poussée mais la PR n'a pas pu être ouverte. Si c'est un refus de permission : Settings → Actions → General → « Allow GitHub Actions to create and approve pull requests »."
            exit 1
          fi
