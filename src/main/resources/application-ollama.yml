# Local inference through Ollama's native OpenAI-compatible endpoint.
spring:
  ai:
    model:
      chat: openai
      embedding: none
    openai:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
      api-key: ${OLLAMA_API_KEY:kex-local}
      # Les réglages de CONNEXION se posent ici, pas sous `chat.options.` : cette clé est un alias de
      # compatibilité qui garde timeout et max-retries pour elle et que rien ne lit — `max-retries: 0`
      # y était posé et le client réessayait trois fois quand même, après un plafond de 60 s.
      timeout: ${KEX_AGENT_MODEL_TIMEOUT:600s}
      max-retries: 0
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}
  mvc:
    async:
      # Au-delà de kex.agent.request-timeout, pour que l'agent rende lui-même une erreur explicite.
      request-timeout: 650s
kex:
  models:
    local-provider: ollama
  agent:
    # Un modèle local met des minutes là où un modèle hébergé met des secondes : les 120 s livrées
    # couperaient l'échange avant la fin du premier appel.
    request-timeout: 600s
    knowledge:
      enabled: false
